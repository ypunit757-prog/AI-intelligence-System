databases:
  - name: ai-knowledge-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: ai-knowledge-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-knowledge-db
          property: connectionString
      - key: VECTOR_STORE
        value: pgvector
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "120"
      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.2"
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-DOMAIN.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
